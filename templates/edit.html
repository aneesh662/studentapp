<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Student</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container narrow">
    <header class="page-header">
      <div><p class="eyebrow">STUDENT ADMINISTRATION</p><h1>Edit student</h1><p class="muted">Update the details for {{ student.name }}.</p></div>
      <a class="button secondary" href="{{ url_for('index') }}">Back to records</a>
    </header>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="messages">
          {% for category, message in messages %}<div class="message {{ category }}">{{ message }}</div>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <section class="panel">
      <form method="post" class="form-grid">
        <label>Full name *<input name="name" required maxlength="120" value="{{ student.name }}"></label>
        <label>Phone<input name="phone" maxlength="40" value="{{ student.phone or '' }}"></label>
        <label>Place<input name="place" maxlength="120" value="{{ student.place or '' }}"></label>
        <label>Course<input name="course" maxlength="120" value="{{ student.course or '' }}"></label>
        <label>Email<input name="email" type="email" maxlength="160" value="{{ student.email or '' }}"></label>
        <label>Joined date<input name="joined_date" type="date" value="{{ student.joined_date.isoformat() if student.joined_date else '' }}"></label>
        <div class="form-actions">
          <button class="button primary" type="submit">Save changes</button>
          <a class="button secondary" href="{{ url_for('index') }}">Cancel</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
