services:
  - type: web
    name: flask-student-management
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-database
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: student-database
    databaseName: students
    user: students_user
